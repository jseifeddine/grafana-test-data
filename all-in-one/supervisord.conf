[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ── infrastructure (priority 10-30) ─────────────────────────────────────────

[program:nginx]
; Proxy layer for graphite-web (graphite-web listens on 127.0.0.1:8001)
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:influxdb]
command=/usr/local/bin/influxd -config /etc/influxdb.conf
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:victoriametrics]
command=/usr/local/bin/victoria-metrics --promscrape.config=/etc/prometheus/prometheus.yml --storageDataPath=/prometheus --retentionPeriod=30d
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:pushgateway]
command=/usr/local/bin/pushgateway
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:carbon-cache]
; Carbon stores whisper files under /opt/graphite/storage/whisper.
; Carbon's Python module lives under opt/graphite/lib (not webapp).
command=/usr/local/bin/carbon-cache.py --config=/opt/graphite/conf/carbon.conf --logdir=/opt/graphite/storage/log/carbon start --nodaemon
environment=PYTHONPATH="/usr/local/lib/python3.10/dist-packages/opt/graphite/lib:/usr/local/lib/python3.10/dist-packages/opt/graphite/webapp",GRAPHITE_ROOT="/opt/graphite"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:graphite-web]
; gunicorn serves the Django graphite app on 127.0.0.1:8001;
; nginx proxies external port 80 → 8001.
command=/usr/local/bin/gunicorn --bind 127.0.0.1:8001 --workers 2 graphite.wsgi:application
environment=DJANGO_SETTINGS_MODULE="graphite.settings",GRAPHITE_ROOT="/opt/graphite",PYTHONPATH="/usr/local/lib/python3.10/dist-packages/opt/graphite/webapp:/usr/local/lib/python3.10/dist-packages/opt/graphite/lib"
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:statsd]
; StatsD forwards metrics to carbon on 127.0.0.1:2003
command=node /usr/lib/node_modules/statsd/stats.js /etc/statsd/config.js
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:grafana]
command=/usr/sbin/grafana-server --homepath=/usr/share/grafana --config=/etc/grafana/grafana.ini
; GF_* env vars are read directly by grafana-server from the process environment.
; Pass GF_SECURITY_ADMIN_PASSWORD through from the container environment.
environment=GF_SECURITY_ADMIN_PASSWORD="%(ENV_GF_SECURITY_ADMIN_PASSWORD)s",GF_PATHS_PROVISIONING="/etc/grafana/provisioning"
autostart=true
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── generators (priority 50) ─────────────────────────────────────────────────
; All generators have internal wait/retry loops so they tolerate services
; starting up concurrently — no explicit ordering needed here.

[program:haproxy-generator]
command=python3 /app/haproxy_generator.py --pushgateway http://localhost:9091
autostart=true
autorestart=true
priority=50
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:k8s-generator]
command=python3 /app/k8s_generator.py --pushgateway http://localhost:9091
autostart=true
autorestart=true
priority=50
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:linux-generator]
command=python3 /app/linux_generator.py --influxdb http://localhost:8086 --days %(ENV_BACKFILL_DAYS)s
autostart=true
autorestart=true
priority=50
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:powerdns-generator]
command=python3 /app/powerdns_generator.py --carbon-host localhost --days %(ENV_BACKFILL_DAYS)s
autostart=true
autorestart=true
priority=50
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:prometheus-backfill]
; Runs once to inject historical data, then exits — same behaviour as the
; original compose service with restart: "no".
command=python3 /app/prometheus_backfill.py --vm-url http://localhost:8428 --days %(ENV_BACKFILL_DAYS)s
autostart=true
autorestart=false
startsecs=0
priority=50
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
