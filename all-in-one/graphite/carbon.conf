[cache]
STORAGE_DIR    = /opt/graphite/storage
CONF_DIR       = /opt/graphite/conf
LOG_DIR        = /opt/graphite/storage/log/carbon
PID_DIR        = /opt/graphite/storage

LOCAL_DATA_DIR = /opt/graphite/storage/whisper

# Accept plaintext metrics on TCP 2003 (same port as the original container)
LINE_RECEIVER_INTERFACE = 0.0.0.0
LINE_RECEIVER_PORT      = 2003

ENABLE_UDP_LISTENER = False

# Internal query port used by graphite-web to read from the cache
CACHE_QUERY_INTERFACE = 127.0.0.1
CACHE_QUERY_PORT      = 7002

MAX_CACHE_SIZE         = inf
MAX_UPDATES_PER_SECOND = 500
MAX_CREATES_PER_MINUTE = 200

LOG_UPDATES    = False
LOG_CACHE_HITS = False
